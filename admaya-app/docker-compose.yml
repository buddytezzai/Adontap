# Local Postgres for development. `npm run db:up` starts it and waits until it is healthy.
# Port 5433 (not 5432) so it never collides with a Postgres you already run.
services:
  db:
    image: postgres:17-alpine
    container_name: admaya-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: admaya
      POSTGRES_PASSWORD: admaya
      POSTGRES_DB: admaya
    ports:
      - "5433:5432"
    volumes:
      - admaya-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admaya -d admaya"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  admaya-pgdata:
